[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "debtalk"
version = "0.1.0"
description = "Linux Mint speech-to-text hotkey tool using faster-whisper"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper>=1.1.0",
  "numpy>=1.26",
  "pynput>=1.8",
  "sounddevice>=0.5",
]

[project.scripts]
debtalk = "debtalk.main:main"

[tool.setuptools.packages.find]
include = ["debtalk*"]
